apiVersion: apps/v1
kind: Deployment
metadata:
  name: go-http-service
  labels:
    app: go-http-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: go-http-service
  template:
    metadata:
      labels:
        app: go-http-service
    spec:
      containers:
        - name: go-http-service
          image: ghcr.io/feyisayoav/golang-service:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: SERVICE_PORT
              value: "8080"
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: go-http-service
  labels:
    app: go-http-service
spec:
  type: ClusterIP
  selector:
    app: go-http-service
  ports:
    - name: http
      port: 8080
      targetPort: 8080
